services:
  backend:
    build: ./backend
    container_name: ${BACKEND_CONTAINER_NAME:-phukien_backend}
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      - PORT=5000
    networks:
      - internal
      - db_net

  frontend:
    build: ./frontend
    container_name: ${FRONTEND_CONTAINER_NAME:-phukien_frontend}
    restart: always
    depends_on:
      - backend
    networks:
      - web
      - internal

networks:
  web:
    external: true
  internal:
    name: ${INTERNAL_NETWORK_NAME:-phukien_internal}
  db_net:
    external: true
