name: CI/CD

on:
  push:
    branches: [main]

jobs:
  # ── Deploy: phukienquathoinuoc.com (first) ───────────────────────────────
  deploy-phukien:
    name: Deploy phukienquathoinuoc
    runs-on: self-hosted
    steps:
      - name: Write backend env
        run: |
          cat > /root/dienlanhecomerce/backend/.env.production << 'ENVEOF'
          ${{ secrets.PHUKIEN_ENV }}
          ENVEOF

      - name: Pull, build & restart
        run: |
          cd /root/dienlanhecomerce
          git pull
          docker compose build
          docker compose up -d

      - name: Clean old Docker images
        run: docker image prune -af

  # ── Deploy: binhminhsmartwatch.com (after phukien finishes) ──────────────
  deploy-binhminh:
    name: Deploy binhminhsmartwatch
    needs: deploy-phukien
    runs-on: self-hosted
    steps:
      - name: Write backend env
        run: |
          cat > /root/binhminhsmartwatch/backend/.env.production << 'ENVEOF'
          ${{ secrets.BINHMINH_ENV }}
          ENVEOF

      - name: Pull, build & restart
        run: |
          cd /root/binhminhsmartwatch
          git pull
          docker compose build
          docker compose up -d

      - name: Clean old Docker images
        run: docker image prune -af
