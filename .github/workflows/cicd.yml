name: CI/CD

on:
  push:
    branches: [main]

jobs:
  # ── Deploy: phukienquathoinuoc.com (first) ───────────────────────────────
  deploy-phukien:
    name: Deploy phukienquathoinuoc
    runs-on: self-hosted
    steps:
      - name: Write backend env
        run: printf '%s' "$PHUKIEN_ENV" > /root/dienlanhecomerce/backend/.env.production
        env:
          PHUKIEN_ENV: ${{ secrets.PHUKIEN_ENV }}

      - name: Write GA4 service account
        run: printf '%s' "$GA4_JSON" > /root/dienlanhecomerce/backend/google-service-account.json
        env:
          GA4_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}

      - name: Pull, build & restart
        run: |
          cd /root/dienlanhecomerce
          git pull
          docker compose build
          docker compose up -d

      - name: Clean old Docker images
        run: docker image prune -af

  # ── Deploy: binhminhsmartwatch.com (after phukien finishes) ──────────────
  deploy-binhminh:
    name: Deploy binhminhsmartwatch
    needs: deploy-phukien
    runs-on: self-hosted
    steps:
      - name: Write backend env
        run: printf '%s' "$BINHMINH_ENV" > /root/binhminhsmartwatch/backend/.env.production
        env:
          BINHMINH_ENV: ${{ secrets.BINHMINH_ENV }}

      - name: Write GA4 service account
        run: printf '%s' "$GA4_JSON" > /root/binhminhsmartwatch/backend/google-service-account.json
        env:
          GA4_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}

      - name: Pull, build & restart
        run: |
          cd /root/binhminhsmartwatch
          git pull
          docker compose build
          docker compose up -d

      - name: Clean old Docker images
        run: docker image prune -af
