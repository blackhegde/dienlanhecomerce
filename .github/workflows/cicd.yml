name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build validation ──────────────────────────────────────────────────────
  build:
    name: Build check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Backend — install & compile TypeScript
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Frontend — install & build Vite
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ── Deploy: phukienquathoinuoc.com ───────────────────────────────────────
  deploy-phukien:
    name: Deploy phukienquathoinuoc
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Pull & restart
        run: |
          cd /root/dienlanhecomerce
          git pull
          docker compose build
          docker compose up -d
          docker image prune -f

  # ── Deploy: binhminhsmartwatch.com ───────────────────────────────────────
  deploy-binhminh:
    name: Deploy binhminhsmartwatch
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Pull & restart
        run: |
          cd /root/binhminhsmartwatch
          git pull
          docker compose build
          docker compose up -d
          docker image prune -f
